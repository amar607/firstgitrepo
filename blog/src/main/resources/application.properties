server.port=${PORT:8080}

# Database connection - reads from Railway MySQL service variables in production,
# falls back to local MySQL defaults when those env vars aren't set (local dev).
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:blog}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:Password1}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#jwt secret - set APP_JWT_SECRET as an env var in production instead of relying on this default
app.jwt-secret=${APP_JWT_SECRET:19513fdc9da4fb72a4a05eb66917548d3c90ff94d5419e1f2363eea89dfee1dd}
app-jwt-expiration_milliseconds=604800000

# CORS - comma-separated list of allowed frontend origins, set via env var in production
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4300}

#Uploaded Files - container-relative path by default; mount a Railway volume at this path if you need uploads to survive redeploys
file.upload-dir=${FILE_UPLOAD_DIR:/app/uploads/}

server.forward-headers-strategy=framework
