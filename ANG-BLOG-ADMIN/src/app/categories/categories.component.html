<div class="container">
    <div class="row">
        <div class="col-md-12 bg-secondary-theme p-5 shadow-effect">
            <h3 class="text-center text-theme-primary"> {{formStatus}} categories </h3>
            <p class="text-center mb-5"> You can add new Categories from here </p>

            <form class="form-inline text-center" #categoryForm = 'ngForm' (ngSubmit) = "onSubmit(categoryForm)">
                <div class="input-group">
                <div class="form-group col-md-4">
                    <input 
                    type="text" 
                    name="categoryName" 
                    class="form-control shadow-effect" 
                    placeholder="Category Name" 
                    #newCategory = 'ngModel'
                    [(ngModel)]="categoryName"
                    required
                    [ngClass]="{'is-invalid': newCategory.touched && newCategory.invalid}">
                    <div class="alert alert-danger" *ngIf="newCategory.touched && newCategory.invalid"> Category field is required </div>
                </div>
                
                <div class="form-group col-md-4 mx-2">
                    <input 
                    type="text" 
                    name="description" 
                    class="form-control shadow-effect" 
                    placeholder="Category description" 
                    #categoryDescription = 'ngModel'
                    [(ngModel)]="description"
                    required
                    [ngClass]="{'is-invalid': categoryDescription.touched && categoryDescription.invalid}">
                    <div class="alert alert-danger" *ngIf="categoryDescription.touched && categoryDescription.invalid"> Category Description is required </div>
                </div>
                <div class="col-md-2">
                    <button class="btn btn-block btn-info mb-2 btn-theme" [disabled] = "categoryForm.invalid" > {{formStatus}} category </button>
                </div>
            </div>
            </form>
        </div>
    </div>
    <div class="row mt-5 mb-5">
        <div class="col-md-3"></div>
        <div class="col-md-6">
            <div class="card shadow-effect">
                <div class="card-body">
                    <table class="table row-border hover">
                        <thead>
                            <tr>
                                <th>No</th>
                                <th>Category</th>
                                <th>Category Description</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor='let category of categoriesArray; let i = index'>
                                <td>{{i+1}}</td>
                                <td>{{category.name}}</td>
                                <td>{{category.description}}</td>
                                <td>
                                    <button class="btn btn-sm btn-warning" (click)="onEdit(category.id, category.name, category.description)"> Edit </button>
                                    <button class="btn btn-sm btn-danger mx-2" (click)="onDelete(category.id)"> Delete </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="col-md-3"></div>
    </div>
</div>
