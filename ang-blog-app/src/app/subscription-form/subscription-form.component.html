<div class="card shadow-effect">
  <div class="card-body div">
    <div class="text-center mb-1 mt-2">
      <h3>SUBSCRIPTION FORM</h3>
      <p class="m-auto subs-text">The Lorem Ipsum for photos.</p>

      <div>
        <form (ngSubmit)="onSubmit()" #form="ngForm" class="form-inline mb-3 mt-4">
          <div class="input-group">
            <div class="form-group col-md-5">
              <input
                type="text"
                [(ngModel)]="name"
                name="name"
                class="form-control shadow-effect"
                placeholder="Your name"
                required
              >
            </div>

            <div class="form-group col-md-5 mx-1">
              <input
                type="email"
                [(ngModel)]="email"
                name="email"
                class="form-control shadow-effect"
                placeholder="Email Address"
                required
              >
            </div>

            <div class="col-md-1">
              <button
                class="btn btn-info btn-block btn-theme"
                type="submit"
                [disabled]="isSubmitting"
              >
                {{ isSubmitting ? 'SUBSCRIBING...' : 'SUBSCRIBE' }}
              </button>
            </div>
          </div>
        </form>

        <!-- Inline Message -->
        <div *ngIf="message" class="mt-3">
          <p [ngClass]="{ 'text-success': isSuccess, 'text-danger': !isSuccess }">
            {{ message }}
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
