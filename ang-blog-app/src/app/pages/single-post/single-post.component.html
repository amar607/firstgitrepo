<div class="container">
    <div class="row">
        <div class="col-md-9">
            <div class="card shadow-effect">
                <img [src]="post.image" placeholder="">
                <div class="card-body">
                    <small class="bg-light text-danger text-center"> Design </small>
                    <small class="bg-light text-success text-center mx-2"> Featured </small>
                    <small class="bg-light text-info text-center mx-2"> Views - 100 </small>
                    <small class="bg-light text-warning text-center mx-2"> Last updated - {{post.createdDate | date:'MMMM yyyy' }} </small>
                    <h1 class="mt-3 mb-3"><b>{{post.title}}</b></h1>
                    <div class="post-content" [innerHTML]="post?.content"></div>
                    
                </div>

            </div>
            <app-comment-form></app-comment-form>
            <app-comment-list></app-comment-list>
        </div>
        <div class="col-md-3">
            <app-post-card></app-post-card>
        </div>
    </div>
</div>
